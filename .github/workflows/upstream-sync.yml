name: Sync upstream fork

on:
  # Daily check for upstream changes (a cheap upstream-SHA ancestor check
  # skips the fetch/merge entirely when nothing changed).
  #
  # NOTE (fork): scheduled workflows in forks only fire after the workflow
  # file has been re-validated by a push to the default branch, or after
  # re-enabling in Settings -> Actions. If the daily run stops appearing,
  # trigger a manual workflow_dispatch or push this file again.
  schedule:
    - cron: '23 3 * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-master:
    runs-on: ubuntu-latest

    env:
      UPSTREAM: 3cky/mbusd

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM }}.git
          git fetch upstream master

      - name: Check if upstream tip is already merged in
        id: changed
        run: |
          UPSTREAM_TIP=$(git rev-parse upstream/master)
          echo "upstream_tip=${UPSTREAM_TIP}"
          # Already an ancestor of our local branch => nothing to do.
          if git merge-base --is-ancestor "${UPSTREAM_TIP}" HEAD; then
            echo "No upstream change; already in sync."
          else
            echo "Upstream has new commits."
            echo "changed=true" >> "$GITHUB_ENV"
            echo "upstream-tip=${UPSTREAM_TIP}" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into master (auto-resolving, never drops code)
        if: env.changed == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Register the 'ours' merge driver for fork-only files.
          git config merge.ours.driver true

          # Try a plain merge first - most daily syncs are clean.
          set +e
          git merge --no-edit upstream/master
          MERGE_RC=$?
          set -e
          if [ "$MERGE_RC" -eq 0 ]; then
            echo "Merged cleanly."
            git push origin master
            exit 0
          fi

          # A plain merge failed. Distinguish:
          #  - conflicts ONLY in fork-only files (mdns.c/h, our workflows)
          #    => safe to auto-resolve by keeping ours.
          #  - conflicts in shared/upstream files => resolve with a proper
          #    3-way merge (git merge-file) that keeps BOTH sides.
          #  - any residual conflict markers after that => FAIL LOUDLY.
          #    We NEVER silently drop either side's code.
          MB=$(git merge-base HEAD upstream/master)
          CONFLICTED=$(git diff --name-only --diff-filter=U || true)
          echo "conflicted files: $CONFLICTED"

          for f in $CONFLICTED; do
            case "$f" in
              src/mdns.c|src/mdns.h|.github/workflows/upstream-sync.yml|.github/workflows/docker-image.yml)
                echo "  fork-only file, keeping ours: $f"
                git checkout --ours -- "$f"
                git add -- "$f"
                ;;
              *)
                echo "  3-way merging shared file: $f"
                git show "$MB:$f" > /tmp/base-f
                git show "HEAD:$f" > /tmp/ours-f
                git show "upstream/master:$f" > /tmp/theirs-f
                # merge-file returns 1 on genuine conflict; capture it
                # without letting set -e abort mid-resolution.
                set +e
                git merge-file /tmp/ours-f /tmp/base-f /tmp/theirs-f
                MF_RC=$?
                set -e
                if [ "$MF_RC" -ne 0 ]; then
                  echo "::error::Genuine conflict in '$f' that cannot be auto-resolved."
                  echo "::error::git merge-file left conflict markers for '$f'."
                  echo "::error::A maintainer must merge upstream/master into master manually"
                  echo "::error::and resolve '$f', then push. Aborting to keep the tree clean."
                  git merge --abort
                  exit 1
                fi
                cp /tmp/ours-f "$f"
                git add -- "$f"
                ;;
            esac
          done

          git commit --no-edit
          git push origin master

      - name: Report result
        if: always()
        run: |
          set +e
          echo "=== current HEAD ==="
          git log --oneline -2
          echo "=== upstream sync status ==="
          git fetch upstream master 2>/dev/null
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "IN SYNC: fork master contains upstream tip $(git rev-parse --short upstream/master)"
          else
            echo "OUT OF SYNC: upstream tip $(git rev-parse --short upstream/master) not merged yet"
          fi
